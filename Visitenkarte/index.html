<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .vcard-wrapper {
            width: 100%;
            max-width: 500px;
        }

        .vcard-container {
            padding: 2rem 1.5rem;
        }

        .info-line {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            line-height: 1.4;
            word-break: break-all;
        }

        .label {
            opacity: 0.6;
            font-family: 'Courier New', Courier, monospace;
        }

        .download-action {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px dashed rgba(0, 216, 255, 0.3);
        }

        .blink-cursor {
            animation: cursor-blink 1s infinite;
        }

        @keyframes cursor-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
