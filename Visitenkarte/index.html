<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lea Yara Blankenstein | Digital vCard</title>
    
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            margin: 0;
        }

        .vcard-wrapper {
            width: 100%;
            max-width: 500px;
        }

        .vcard-container {
            padding: 1.5rem 1.2rem;
        }

        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .story-header span {
            white-space: nowrap;
        }

        .info-line {
            display: flex;
            flex-direction: row;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .label {
            opacity: 0.6;
            font-family: 'Courier New', Courier, monospace;
            width: 70px; 
            flex-shrink: 0;
        }

        .value {
            font-weight: bold;
            overflow-wrap: break-word;
            word-break: keep-all;     
        }

        .value-link {
            overflow-wrap: break-word;
            word-break: break-all;
        }

        .download-action {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px dashed rgba(0, 216, 255, 0.3);
        }

        .download-action .project-link {
            text-align: center;
            min-width: 200px;
        }

        .blink-cursor {
            animation: cursor-blink 1s infinite;
        }

        @keyframes cursor-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>

<body class="crt">

    <div class="vcard-wrapper">
        <section id="story" style="padding: 0;">
            <div class="bento-box vcard-container">

                <div class="story-header" style="margin-bottom: 1.5rem;">
                    <span style="font-size: 1rem; opacity: 0.8;">> root@yara:~/vcard_data</span>
                    <span style="font-size: 1rem;">[ _ ] [ □ ] [ x ]</span>
                </div>

                    <div class="vcard-body">
                    <div class="info-line">
                        <span class="label">NAME:</span> 
                        <span class="value">Yara Blankenstein<span class="blink-cursor" style="color: #00ff41;">_</span></span>
                    </div>
                    
                    <div class="info-line">
                        <span class="label">ROLE:</span> 
                        <span class="value">Fachinformatikerin für Systemintegration</span>
                    </div>

                    <div class="info-line">
                        <span class="label">LOC :</span> 
                        <span class="value">Papenburg, Niedersachsen</span>
                    </div>

                    <div class="info-line">
                        <span class="label">MAIL:</span> 
                        <span class="value value-link">yblankenstein@proton.me</span>
                    </div>

                    <div class="info-line">
                        <span class="label">WWW :</span> 
                        <span class="value value-link">
                            <a href="https://yara.pw" class="timeline-link" style="background: none; padding: 0;">https://yara.pw</a>
                        </span>
                    </div>

                    <div class="download-action">
                        <a href="Yara.vcf" download="Yara.vcf" class="project-link" style="font-size: 1.2rem;">
                            [>> DOWNLOAD_VCARD.VCF]
                        </a>
                        <a href="https://yara.pw" class="project-link" style="font-size: 1.2rem; color: rgba(0, 216, 255, 0.7); border-color: rgba(0, 216, 255, 0.4);">
                            [>> ./return_to_main.sh]
                        </a>
                    </div>
                </div>

            </div>
        </section>
    </div>

</body>
</html>
