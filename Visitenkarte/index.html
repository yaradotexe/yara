<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara Blankenstein | Digital vCard</title>
    
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            margin: 0;
        }

        .vcard-wrapper {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .vcard-container {
            padding: 2rem 1.5rem !important; /* Erzwingt sauberes Innen-Padding der Box */
            box-sizing: border-box;
        }

        .vcard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
            border-bottom: 1px dashed rgba(0, 216, 255, 0.3);
            padding-bottom: 0.5rem;
        }

        .vcard-header span {
            white-space: nowrap;
        }

        .vcard-data-grid {
            display: grid;
            grid-template-columns: 80px 1fr; 
            gap: 1.2rem 0.5rem;
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 2rem;
            text-align: left;
        }

        .vcard-field-label {
            opacity: 0.6;
            font-family: 'Courier New', Courier, monospace;
            white-space: nowrap;
        }

        .vcard-field-value {
            font-weight: bold;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .vcard-field-link {
            word-break: break-all;
        }

        .vcard-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px dashed rgba(0, 216, 255, 0.3);
        }

        .vcard-actions .project-link {
            text-align: center;
            min-width: 210px;
        }
        .vcard-blink {
            animation: vcard-cursor-blink 1s infinite;
        }

        @keyframes vcard-cursor-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>

<body class="crt">

    <div class="vcard-wrapper">
        <section id="story" style="padding: 0;">
            <div class="bento-box vcard-container">

                <div class="vcard-header">
                    <span style="font-size: 1rem; opacity: 0.8;">> root@yara:~/vcard_data</span>
                    <span style="font-size: 1rem;">[ _ ] [ □ ] [ x ]</span>
                </div>

                <div class="vcard-data-grid">
                    <div class="vcard-field-label">NAME:</div>
                    <div class="vcard-field-value">(Lea) Yara Blankenstein<span class="vcard-blink" style="color: #00ff41;">_</span></div>
                    
                    <div class="vcard-field-label">ROLE:</div>
                    <div class="vcard-field-value">Fachinformatikerin für Systemintegration</div>

                    <div class="vcard-field-label">LOC:</div>
                    <div class="vcard-field-value">Papenburg, Niedersachsen</div>

                    <div class="vcard-field-label">MAIL:</div>
                    <div class="vcard-field-value vcard-field-link">yblankenstein@proton.me</div>

                    <div class="vcard-field-label">WWW:</div>
                    <div class="vcard-field-value vcard-field-link">
                        <a href="https://yara.pw" class="timeline-link" style="background: none; padding: 0;">https://yara.pw</a>
                    </div>
                </div>

                <div class="vcard-actions">
                    <a href="Yara.vcf" download="Yara.vcf" class="project-link" style="font-size: 1.2rem;">
                        [>> DOWNLOAD_VCARD.VCF]
                    </a>
                    <a href="https://yara.pw" class="project-link" style="font-size: 1.2rem; color: rgba(0, 216, 255, 0.7); border-color: rgba(0, 216, 255, 0.4);">
                        [>> ./return_to_main.sh]
                    </a>
                </div>

            </div>
        </section>
    </div>

</body>
</html>
